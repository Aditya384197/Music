name: Build Aditya Music (Android 16)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android16-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build Android 16 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK packages
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK command-line tools were not found in $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build Android 16 APK
        run: gradle --no-daemon assembleDebug

      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: AdityaMusic-Android16-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
